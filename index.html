
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SANMON:04 — 小4算数 まるごと学習ゲーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Cinzel+Decorative:wght@700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #000000;
  --accent-green: #22c55e;
  --accent-yellow: #facc15;
  --neon-glow: 0 0 10px rgba(34, 197, 94, 0.8), 0 0 20px rgba(250, 204, 21, 0.4);
}

body {
  margin: 0; padding: 0; overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: var(--bg-deep);
  color: #e2e8f0;
}

#root { position: relative; z-index: 10; height: 100vh; }

/* --- Space HUD & Hologram Styles --- */
.hud-panel {
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(74, 222, 128, 0.25);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(74, 222, 128, 0.03);
}

.text-hologram {
  /* SANMON:04 のブランド配色: 緑(左)から黄(右)へのグラデーション。白は使わない。 */
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-style: italic;
  background: linear-gradient(100deg, #bbf7d0 0%, #4ade80 22%, #22c55e 42%, #84cc16 60%, #eab308 78%, #facc15 92%, #fde68a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 14px rgba(74, 222, 128, 0.5)) drop-shadow(0 4px 2px rgba(0, 0, 0, 0.8));
}

.btn-tactical {
  background: rgba(74, 222, 128, 0.04);
  border: 1px solid rgba(74, 222, 128, 0.3);
  color: #fff;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-tactical:hover {
  background: rgba(74, 222, 128, 0.12);
  border-color: rgba(250, 204, 21, 0.7);
  box-shadow: 0 0 30px rgba(250, 204, 21, 0.25);
  letter-spacing: 0.1em;
}

.adventure-cta {
  background: linear-gradient(120deg, rgba(21, 128, 61, 0.92) 0%, rgba(22, 163, 74, 0.88) 45%, rgba(202, 138, 4, 0.8) 100%);
  border: 2px solid rgba(250, 204, 21, 0.55);
  box-shadow: 0 0 40px rgba(74, 222, 128, 0.35), 0 0 80px rgba(250, 204, 21, 0.15), inset 0 0 40px rgba(255, 255, 255, 0.05);
  animation: adventure-glow 3s ease-in-out infinite;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.adventure-cta:hover {
  transform: translateY(-2px) scale(1.008);
  border-color: rgba(253, 224, 71, 0.9);
  box-shadow: 0 0 60px rgba(250, 204, 21, 0.5), 0 0 110px rgba(74, 222, 128, 0.3), inset 0 0 40px rgba(255, 255, 255, 0.08);
}
@keyframes adventure-glow {
  0%, 100% { box-shadow: 0 0 40px rgba(74, 222, 128, 0.35), 0 0 80px rgba(250, 204, 21, 0.15), inset 0 0 40px rgba(255, 255, 255, 0.05); }
  50% { box-shadow: 0 0 55px rgba(74, 222, 128, 0.5), 0 0 100px rgba(250, 204, 21, 0.28), inset 0 0 40px rgba(255, 255, 255, 0.05); }
}

.corner-accent {
  position: absolute; width: 12px; height: 12px; border-color: rgba(74, 222, 128, 0.6); border-style: solid;
}
.lt { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.rt { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
.lb { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
.rb { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

@keyframes math-fade-in {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-math-fade-in {
  animation: math-fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes level-up-reveal {
  0% { transform: scale(0.8) translateY(40px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.animate-level-up-reveal {
  animation: level-up-reveal 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
}

@keyframes pulse-slow {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.03); opacity: 0.9; }
}
.animate-pulse-slow {
  animation: pulse-slow 4s infinite ease-in-out;
}

.card-container { perspective: 1000px; width: 14rem; height: 18rem; }
.card-inner {
  position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d; cursor: pointer;
}
.card-inner.is-flipped { transform: rotateY(180deg); }
.card-front, .card-back {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
}
.card-front { transform: rotateY(180deg); }

@keyframes screen-shake {
  0%, 100% { transform: translate(0, 0); }
  10%, 30%, 50%, 70%, 90% { transform: translate(-2px, 1px); }
  20%, 40%, 60%, 80% { transform: translate(2px, -1px); }
}
.vfx-shake { animation: screen-shake 0.4s both; }

@keyframes success-burst {
  0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
  100% { box-shadow: 0 0 50px 100px rgba(255, 255, 255, 0); }
}
.vfx-success { animation: success-burst 0.5s ease-out; }

</style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
